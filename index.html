<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Timeboxing</title>
<meta name="theme-color" content="#0a8579">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Timeboxing">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f5f7;--card:#fff;--ink:#15202b;--sub:#738291;--line:#e4e9ee;--plan:#eaf0f7;--done:#d9f4ee;--accent:#0a8579;--ok:#0a8579;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1318;--card:#161d24;--ink:#eaf0f5;--sub:#8695a3;--line:#243039;--plan:#1c2833;--done:#123a33;--accent:#2cd4be;--ok:#2cd4be;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1318;--card:#161d24;--ink:#eaf0f5;--sub:#8695a3;--line:#243039;--plan:#1c2833;--done:#123a33;--accent:#2cd4be;--ok:#2cd4be;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;font-size:15px;line-height:1.4}
.wrap{max-width:640px;margin:0 auto;padding:16px 14px 60px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
h1{font-size:20px;margin:0}
.date{display:flex;align-items:center;gap:6px}
.date button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;width:32px;height:32px;font-size:16px}
.date input{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;height:32px;padding:0 6px;font:inherit;font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
.card h2{font-size:13px;margin:0 0 8px;color:var(--sub);letter-spacing:.04em}
.big{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.big input[type=text]{flex:1;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;padding:6px 2px;outline:none}
.big input[type=checkbox],.item input[type=checkbox]{width:20px;height:20px;accent-color:var(--ok);flex:none}
.big .n{color:var(--accent);font-weight:700;width:16px}
.big.done input[type=text]{text-decoration:line-through;color:var(--sub)}
.bar{height:6px;background:var(--line);border-radius:3px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}
.stats{display:flex;gap:8px;margin-bottom:12px}
.stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.stat b{display:block;font-size:20px;color:var(--accent)}
.stat span{font-size:11px;color:var(--sub)}
.add{display:flex;gap:6px;margin-bottom:8px}
.add input{flex:1;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--ink);font:inherit;padding:8px 10px;outline:none}
.add button{border:0;background:var(--accent);color:#fff;border-radius:10px;padding:0 14px;font:inherit;font-weight:600}
.item{display:flex;align-items:center;gap:8px;padding:8px 6px;border-radius:10px;background:var(--bg);margin-bottom:5px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:grab}
.item span{flex:1;word-break:break-word}
.item.done span{text-decoration:line-through;color:var(--sub)}
.item .x{border:0;background:transparent;color:var(--sub);font-size:18px;padding:0 4px}
.empty{font-size:12px;color:var(--sub);text-align:center;padding:6px}
.hint{font-size:12px;color:var(--sub);margin-top:4px}
.grid{display:grid;grid-template-columns:42px 1fr 28px 1fr;gap:3px;align-items:stretch}
.cp{border:1px solid var(--line);background:var(--card);color:var(--sub);border-radius:7px;font-size:13px;padding:0;min-height:32px}
.cp.on{background:#0a8579;border-color:#0a8579;color:#fff}
.head{font-size:11px;color:var(--sub);text-align:center;padding-bottom:2px;font-weight:600}
.hr{font-size:12px;color:var(--sub);text-align:right;padding-top:7px;padding-right:4px}
.hr.half{opacity:.45;font-size:11px}
.hr.now{color:var(--accent);font-weight:700;opacity:1}
.cell{border-radius:7px;min-height:32px;padding:6px 8px;font-size:13px;border:1px solid transparent;outline:none;word-break:break-word}
.cell.p{background:var(--plan)}
.cell.d{background:var(--done)}
.cell:focus{border-color:var(--accent)}
.cell.over{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.cell:empty::before{content:"·";color:var(--sub);opacity:.5}
.ghost{position:fixed;z-index:99;pointer-events:none;background:var(--accent);color:#fff;padding:8px 12px;border-radius:10px;font-size:13px;max-width:220px;box-shadow:0 6px 18px rgba(0,0,0,.25);transform:translate(-50%,-130%)}
.tip{font-size:12px;color:var(--sub);text-align:center;margin-top:8px}
.pdfbtn{display:block;margin:0 0 12px auto;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 14px;font:inherit;font-size:13px;font-weight:600}
.pdfbtn[hidden]{display:none}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tab{flex:1;border:1px solid var(--line);background:var(--card);color:var(--sub);border-radius:10px;padding:8px;font:inherit;font-weight:600}
.tab.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.swipe{display:flex;align-items:flex-start;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;overscroll-behavior-x:contain;scrollbar-width:none}
.swipe::-webkit-scrollbar{display:none}
.pane{flex:0 0 100%;min-width:100%;scroll-snap-align:start;scroll-snap-stop:always;display:flow-root}
.sditem{display:flex;align-items:center;gap:8px;padding:8px 6px;border-radius:10px;background:var(--bg);margin-bottom:5px}
.sditem span{flex:1;word-break:break-word}
.sditem.done span{text-decoration:line-through;color:var(--sub)}
.sditem input[type=checkbox]{width:20px;height:20px;accent-color:var(--ok);flex:none}
.sditem button{border:0;background:transparent;color:var(--sub);font-size:13px;padding:2px 6px}
.sditem .x{font-size:18px}
.sditem .mv{border:1px solid var(--line);border-radius:8px;color:var(--accent);font-weight:600}
.rsum{display:flex;align-items:baseline;gap:8px}
.rsum b{font-size:24px;color:var(--accent)}
.hrow{display:flex;align-items:center;gap:8px;font-size:13px;padding:6px 0;cursor:pointer}
.hrow .lb{width:72px;color:var(--sub)}
.hbar{flex:1;height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.hbar i{display:block;height:100%;background:var(--ok)}
.hrow .v{width:86px;text-align:right}
.mnav{display:flex;justify-content:center;align-items:center;gap:14px;margin-bottom:10px}
.mnav button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;width:32px;height:32px;font-size:16px}
.rcard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 14px;margin-bottom:12px}
.rcard .ttl{text-align:center;font-weight:700;font-size:16px;margin-bottom:12px}
.rcard .pct{text-align:center;font-size:12px;color:var(--sub);margin-bottom:12px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal i{aspect-ratio:1;border-radius:8px;font-style:normal;font-size:11px;display:flex;align-items:center;justify-content:center;background:var(--line);color:var(--sub);cursor:default}
.cal i.on{background:#0a8579;color:#fff}
.cal i.off{opacity:.35;cursor:default}
.cal i.blank{background:transparent;cursor:default}
.cal i.today{outline:2px solid var(--accent);outline-offset:1px}
#rlist .sditem.done{background:#0a8579}
#rlist .sditem.done span{text-decoration:none;color:#fff;font-weight:600}
#rlist .sditem.done .x{color:#fff}
textarea{width:100%;min-height:84px;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--ink);font:inherit;padding:8px;resize:vertical;outline:none}
.rvl{font-size:12px;color:var(--sub);margin:12px 0 4px}
.rvsum{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--sub);margin-bottom:4px}
.rvsum b{color:var(--accent);font-size:15px;margin-left:4px}
.wd{font-size:13px;color:var(--sub);margin-top:2px}
.wd.sat{color:#6f93e6}
.wd.sun{color:#e5534b}
.card.over{outline:2px solid var(--accent);outline-offset:-2px}
.dpick{position:relative;height:32px;min-width:92px;border:1px solid var(--line);background:var(--card);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;padding:0 10px}
.dpick input{position:absolute;left:0;top:0;width:100%;height:100%;opacity:0;border:0;padding:0;cursor:pointer}
.gscroll{max-height:min(58vh,400px);overflow-y:auto;position:relative;border-radius:10px}
.grid>:nth-child(-n+4){position:sticky;top:0;background:var(--card);z-index:2}
.rng{display:flex;align-items:center;gap:8px;margin:8px 0}
.rng .rl{flex:1;font-size:13px;color:var(--sub)}
.rng .rl b{color:var(--ink);margin-left:4px}
.rng button{width:40px;height:32px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;font-size:16px;padding:0}
.rmsg{font-size:12px;color:var(--accent);min-height:16px}
.cell{-webkit-touch-callout:none}
.p1{--pc:#e5534b}.p2{--pc:#e8b630}.p3{--pc:#6f93e6}
.pri{width:26px;height:26px;border:0;padding:0;flex:none;background:transparent;display:inline-flex;align-items:center;justify-content:center}
.pri::before{content:'';width:13px;height:13px;border-radius:50%;background:var(--pc)}
.item.p1,#sdList .sditem.p1{box-shadow:inset 3px 0 0 #e5534b}
.item.p2,#sdList .sditem.p2{box-shadow:inset 3px 0 0 #e8b630}
.item.p3,#sdList .sditem.p3{box-shadow:inset 3px 0 0 #6f93e6}
#sdList .sditem{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:grab}
.moods{display:flex;gap:8px}
.moods button{flex:1;border:1px solid var(--line);background:transparent;border-radius:10px;font-size:22px;padding:6px 0}
.moods button.on{background:var(--plan);border-color:var(--ok)}
h2.fold{cursor:pointer;display:flex;justify-content:space-between;align-items:center;user-select:none;-webkit-user-select:none}
h2.fold::after{content:'▾';font-size:13px}
.card.closed h2.fold{margin-bottom:0}
.card.closed h2.fold::after{content:'▸'}
.card.closed>*:not(h2){display:none}
.pdfbtn:disabled{opacity:.6}

/* ===== v1030b 새 디자인 ===== */
:root{--on:#fff;--sh:0 1px 2px rgba(15,32,43,.05),0 4px 16px rgba(15,32,43,.06)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--on:#04241f;--sh:0 0 0 1px var(--line)}}
:root[data-theme="dark"]{--on:#04241f;--sh:0 0 0 1px var(--line)}
body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
.wrap{padding:22px 16px 130px}
header{margin-bottom:18px;align-items:flex-end}
h1{font-size:26px;font-weight:800;letter-spacing:-.035em;line-height:1.1}
.wd{font-size:14px;font-weight:600;margin-top:5px}
.date{gap:5px}
.date button,.dpick{height:38px;border:0;background:var(--card);box-shadow:var(--sh);border-radius:13px;color:var(--ink)}
.date button{width:38px;font-size:18px;color:var(--sub)}
.dpick{min-width:92px;font-weight:700;font-size:14px}
.tabs{position:fixed;z-index:20;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(320px,calc(100% - 32px));margin:0;padding:5px;gap:4px;border-radius:999px;background:var(--card);background:color-mix(in srgb,var(--card) 80%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);box-shadow:0 10px 30px rgba(15,32,43,.18),0 0 0 1px var(--line)}
.tab{border:0;background:transparent;border-radius:999px;padding:12px 0;font-weight:700;font-size:15px;color:var(--sub);transition:background .2s,color .2s}
.tab.on{background:var(--accent);color:var(--on)}
.stats{gap:10px;margin-bottom:14px}
.stat{border:0;border-radius:24px;box-shadow:var(--sh);padding:18px 16px;text-align:left;flex:1}
.stat:last-child{flex:1.4;background:var(--accent);box-shadow:none}
.stat b{font-size:34px;font-weight:800;letter-spacing:-.045em;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.stat:last-child b{color:var(--on)}
.stat span{display:block;margin-top:8px;font-size:12px;font-weight:600;color:var(--sub)}
.stat:last-child span{color:var(--on);opacity:.85}
.card{border:0;border-radius:26px;box-shadow:var(--sh);padding:18px 16px;margin-bottom:14px}
.card h2{font-size:15px;font-weight:800;letter-spacing:-.01em;color:var(--ink);margin:0 0 12px}
.bar{height:8px;border-radius:4px;margin-top:10px}
.big{gap:12px;padding:4px 0;margin-bottom:2px;border-bottom:1px solid var(--line)}
.big:last-of-type{border-bottom:0}
.big .n{font-weight:800;width:18px}
.big input[type=text]{border:0;font-size:16px;font-weight:600;padding:9px 0}
.wrap input[type=checkbox]{-webkit-appearance:none;appearance:none;width:24px;height:24px;margin:0;flex:none;border-radius:50%;border:2px solid color-mix(in srgb,var(--sub) 45%,transparent);background:transparent;display:inline-grid;place-content:center;transition:background .15s,border-color .15s}
.wrap input[type=checkbox]:checked{background:var(--accent);border-color:var(--accent)}
.wrap input[type=checkbox]:checked::after{content:'';width:6px;height:11px;border:solid var(--on);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.add{gap:8px;margin-bottom:10px}
.add input{border:0;background:var(--bg);border-radius:15px;padding:13px 15px;font-size:15px;color:var(--ink)}
.add button{border-radius:15px;background:var(--accent);color:var(--on);font-weight:700;padding:0 18px}
.item,.sditem{border-radius:16px;background:var(--bg);padding:10px 10px 10px 12px;margin-bottom:6px}
.item span,.sditem span{font-weight:500}
.item.done span,.sditem.done span{color:var(--sub);text-decoration:line-through}
.hint,.tip{color:var(--sub);font-size:12px}
.empty{color:var(--sub)}
.gscroll{background:var(--bg);border-radius:18px;padding:0 5px 5px}
.grid{gap:4px}
.grid>:nth-child(-n+4){background:var(--bg)}
.head{font-size:12px;font-weight:800;color:var(--sub);padding:8px 0 4px}
.hr{font-size:12px;font-weight:700;color:var(--sub);font-variant-numeric:tabular-nums}
.hr.half{opacity:.5;font-weight:600}
.hr.now{color:var(--accent);opacity:1}
.cell{border-radius:11px;min-height:38px;padding:9px 10px;font-size:14px}
.cell.p{background:var(--plan)}
.cell.d{background:var(--done)}
.cell:focus{border-color:transparent;box-shadow:0 0 0 2px var(--accent)}
.cp{border:0;background:var(--card);color:var(--sub);border-radius:11px}
.cp.on{background:var(--accent);color:var(--on)}
.rng button{border:0;background:var(--bg);border-radius:12px;width:44px;height:36px;font-weight:700;color:var(--ink)}
.rng .rl{font-weight:600}
.pdfbtn{border:0;background:transparent;box-shadow:none;color:var(--sub);padding:4px 2px;margin:-6px 0 10px auto;font-size:13px;font-weight:600}
.rsum b{font-size:32px;font-weight:800;letter-spacing:-.04em;color:var(--accent)}
.rcard{border:0;border-radius:26px;box-shadow:var(--sh);padding:18px 16px}
.rcard .ttl{font-size:15px;font-weight:800;margin-bottom:12px}
.cal{gap:6px}
.cal i{border-radius:11px;background:var(--bg);color:var(--sub);font-size:12px;font-weight:600}
.cal i.on{background:var(--accent);color:var(--on)}
.cal i.today{outline:2px solid var(--accent);outline-offset:2px}
#rlist .sditem.done{background:var(--accent)}
#rlist .sditem.done span{color:var(--on)}
.mnav b{font-size:15px}
.mnav button{border:0;background:var(--card);box-shadow:var(--sh);border-radius:12px;color:var(--ink)}
.ghost{background:var(--ink);color:var(--card)}
.swipe{margin:0 -8px}
.pane{box-sizing:border-box;padding:6px 8px 12px}
/* 브레인덤프: 분류 + 세부 할일 */
.cats{display:flex;gap:6px;margin-bottom:8px}
.cats button{flex:1;border:0;border-radius:12px;padding:9px 0;background:var(--bg);color:var(--sub);font:inherit;font-weight:700;font-size:14px}
.cats button.on{background:var(--ink);color:var(--card)}
.bdgrp{border-radius:18px;margin-bottom:10px}
.bdgrp.over{outline:2px solid var(--accent);outline-offset:3px}
.bdh{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:800;color:var(--ink);margin:8px 2px 8px}
.bdh i{font-style:normal;font-weight:700;font-size:12px;color:var(--on);background:var(--accent);border-radius:999px;padding:1px 8px}
.item .no,.item .prog{flex:none}
.item .no{min-width:20px;font-size:12px;font-weight:700;color:var(--sub);font-variant-numeric:tabular-nums}
.item .prog{font-size:12px;font-weight:700;color:var(--sub)}
.item .plus{color:var(--accent);font-size:20px;font-weight:700}
.item.sub{margin-left:24px;padding:6px 8px;background:transparent;box-shadow:none;border-left:2px solid var(--line);border-radius:0 12px 12px 0}
.item.sub .no{min-width:26px}
.subadd{margin:0 0 6px 24px}
.subadd input{width:100%;border:0;border-radius:12px;background:var(--bg);color:var(--ink);font:inherit;font-size:14px;padding:10px 12px;outline:2px solid var(--accent)}

/* ===== v1102a 디자인 개편 ===== */
:root{--page:#fff;--bg:#f2f4f7;--card:#fff;--ink:#0f1720;--sub:#6b7885;--line:#e8ecf0;--plan:#e8ecfb;--done:#d8f2ec;--pri:#0f1720;--onpri:#fff;--pl:#7f90e8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:#0c1014;--bg:#161c22;--card:#0c1014;--ink:#edf2f6;--sub:#8b99a6;--line:#222b33;--plan:#1f2540;--done:#133a33;--pri:#edf2f6;--onpri:#0c1014;--pl:#8d9cf0}}
:root[data-theme="dark"]{--page:#0c1014;--bg:#161c22;--card:#0c1014;--ink:#edf2f6;--sub:#8b99a6;--line:#222b33;--plan:#1f2540;--done:#133a33;--pri:#edf2f6;--onpri:#0c1014;--pl:#8d9cf0}
body{background:var(--page);font-family:"IBM Plex Sans KR",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;letter-spacing:-.01em;line-height:1.45}
button,input,textarea{font-family:inherit}
.wrap{padding:20px 18px 150px}
/* 헤더: 날짜가 주인공 */
header{display:grid;grid-template-columns:1fr auto;grid-template-areas:"h1 date" "wd wd";align-items:center;row-gap:8px;margin-bottom:22px}
header>div:first-child{display:contents}
h1{grid-area:h1;display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;letter-spacing:0;color:var(--sub);line-height:1}
h1::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--accent)}
.wd{grid-area:wd;font-size:30px;font-weight:700;letter-spacing:-.045em;line-height:1.2;margin:0;color:var(--ink)}
.wd.sat{color:#5b82e0}.wd.sun{color:#e5534b}
.tdy{display:inline-block;vertical-align:middle;margin-left:10px;transform:translateY(-2px);font-size:12px;font-weight:600;letter-spacing:0;line-height:1;padding:5px 10px;border-radius:999px;background:var(--accent);color:var(--on)}
.date{grid-area:date;gap:0;padding:3px;border-radius:999px;background:var(--bg)}
.date button{width:34px;height:34px;border-radius:50%;background:transparent;box-shadow:none;color:var(--sub);font-size:18px}
.dpick{grid-area:auto;height:34px;min-width:74px;padding:0 12px;border-radius:999px;background:var(--page);box-shadow:0 1px 3px rgba(15,23,32,.1);font-size:13px;font-weight:600}
.pdfbtn{display:block;width:100%;margin:0 0 6px;padding:15px;border:0;border-radius:18px;background:var(--bg);color:var(--ink);font-size:14px;font-weight:600}
/* 요약 타일 */
.stats{gap:10px;margin-bottom:28px}
.stat{display:flex;flex-direction:column;justify-content:space-between;min-height:116px;padding:18px;border-radius:26px;background:var(--bg);box-shadow:none}
.stat b{font-size:42px;font-weight:700;letter-spacing:-.05em;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums}
.stat span{margin:0;font-size:12px;font-weight:500;color:var(--sub)}
.stat:last-child{flex:1.35;background:var(--accent)}
.stat:last-child b{color:var(--on)}
.stat:last-child span{color:var(--on);opacity:.85}
/* 섹션: 카드 박스 대신 여백과 가는 선 */
.card{background:transparent;box-shadow:none;border:0;border-top:1px solid var(--line);border-radius:0;padding:22px 0 4px;margin-bottom:26px}
.card h2{font-size:17px;font-weight:700;letter-spacing:-.025em;color:var(--ink);margin:0 0 14px}
.card.over{background:color-mix(in srgb,var(--accent) 8%,transparent);border-radius:18px}
h2.fold::after,.card.closed h2.fold::after{content:'';width:8px;height:8px;margin-right:5px;border:solid var(--sub);border-width:0 2px 2px 0;font-size:0;transition:transform .2s}
h2.fold::after{transform:translateY(-2px) rotate(45deg)}
.card.closed h2.fold::after{transform:rotate(-45deg)}
.bar{height:6px;margin-top:14px;background:var(--bg)}
/* BIG 3 */
.big{gap:12px;padding:5px 0;margin:0;border-bottom:1px solid var(--line)}
.big .n{width:26px;height:26px;border-radius:50%;background:var(--bg);color:var(--ink);font-size:13px;font-weight:700;display:grid;place-items:center;flex:none;font-variant-numeric:tabular-nums}
.big input[type=text]{font-size:16px;font-weight:500;padding:10px 0}
.big.done .n{background:var(--accent);color:var(--on)}
/* 입력 */
.add{gap:8px;margin-bottom:6px}
.add input{background:var(--bg);border-radius:14px;padding:14px 16px;font-size:15px}
.add button{background:var(--pri);color:var(--onpri);border-radius:14px;width:50px;padding:0;flex:none;display:grid;place-items:center}
.cats{background:var(--bg);border-radius:14px;padding:4px;gap:4px;margin-bottom:10px}
.cats button{background:transparent;border-radius:11px;padding:10px 0;font-weight:600}
.cats button.on{background:var(--pri);color:var(--onpri)}
/* 목록: 얇은 구분선 */
.item,.sditem{gap:10px;padding:13px 2px;margin:0;border-radius:0;background:transparent;border-bottom:1px solid var(--line)}
.item.p1,.item.p2,.item.p3,#sdList .sditem.p1,#sdList .sditem.p2,#sdList .sditem.p3{box-shadow:none}
.item span,.sditem span{font-weight:500}
.item.done,.sditem.done{opacity:.6}
.pri::before{width:10px;height:10px}
.bdgrp{margin-bottom:6px;border-radius:16px}
.bdgrp>*:last-child,#sdList .sditem:last-child{border-bottom:0}
.bdh{display:flex;align-items:baseline;gap:7px;margin:16px 0 0;font-size:14px;font-weight:700;color:var(--ink)}
.bdh i{padding:0;background:none;color:var(--sub);font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.item.sub{position:relative;margin-left:36px;padding:10px 2px;background:transparent;border:0;border-radius:0}
.item.sub::before{content:'';position:absolute;left:-16px;top:0;bottom:0;border-left:1.5px solid var(--line)}
.item.sub .no{min-width:30px}
.item:has(+.item.sub){border-bottom-color:transparent}
.subadd{margin:2px 0 8px 36px}
.subadd input{background:var(--bg);border-radius:12px;outline:2px solid var(--accent)}
.empty{padding:14px 0;text-align:left;font-size:13px}
.hint,.tip{font-size:12px;line-height:1.5;color:var(--sub);text-align:left;margin-top:10px}
/* 시간표: 이 화면의 중심 */
.card.hero{border-top:0;padding-top:4px}
.gscroll{background:var(--bg);border-radius:26px;padding:0 8px 8px;max-height:min(60vh,430px)}
.grid{gap:5px}
.grid>:nth-child(-n+4){background:var(--bg)}
.head{display:flex;align-items:center;justify-content:center;gap:6px;padding:14px 0 8px;font-size:12px;font-weight:700;color:var(--sub)}
.head::before{content:'';width:8px;height:8px;border-radius:50%}
.grid>:nth-child(2)::before{background:var(--pl)}
.grid>:nth-child(4)::before{background:var(--accent)}
.hr{font-size:12px;font-weight:600;color:var(--sub);padding-top:11px}
.hr.half{opacity:.45}
.cell{min-height:42px;padding:10px 12px;border-radius:13px;font-size:14px}
.cell.p{background:var(--plan)}
.cell.d{background:var(--done)}
.cp{background:var(--page);border-radius:13px}
.cp.on{background:var(--accent);color:var(--on)}
.rng{margin:12px 2px}
.rng .rl{font-size:13px;font-weight:500}
.rng button{background:var(--bg);border-radius:12px}
/* 루틴 */
.rsum b{font-size:36px;font-weight:700;letter-spacing:-.05em;color:var(--ink)}
#rlist .sditem{padding:14px;margin-bottom:8px;border:0;border-radius:16px;background:var(--bg);opacity:1}
#rlist .sditem.done{background:var(--accent)}
#rlist .sditem.done span{color:var(--on)}
.mnav{gap:18px;margin:6px 0 14px}
.mnav b{font-size:16px;font-weight:700;min-width:92px;text-align:center}
.mnav button{width:36px;height:36px;border-radius:50%;background:var(--bg);box-shadow:none;color:var(--ink)}
.rcard{background:var(--bg);box-shadow:none;border-radius:26px;padding:18px 16px}
.rcard .ttl{font-size:15px;font-weight:700}
.cal i{background:var(--page);color:var(--sub);border-radius:50%;font-weight:500}
.cal i.on{background:var(--accent);color:var(--on)}
.cal i.today{outline:2px solid var(--ink);outline-offset:1px}
.cal i.blank{background:transparent}
/* 하단 탭 */
.tabs{background:color-mix(in srgb,var(--page) 78%,transparent);box-shadow:0 12px 32px rgba(15,23,32,.16),0 0 0 1px var(--line)}
.tab.on{background:var(--pri);color:var(--onpri)}
.wrap>.tip{text-align:center;margin-top:28px;opacity:.7}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.add input:focus-visible{outline-offset:0}

/* 루틴 실행률 */
.rpc{font-style:normal;flex:none;font-size:12px;font-weight:600;color:var(--sub);font-variant-numeric:tabular-nums;margin-right:2px}
#rlist .sditem.done .rpc{color:var(--on);opacity:.8}
.rcard .ttl{display:flex;align-items:center;gap:8px;text-align:left;margin-bottom:14px}
.rcard .ttl span{flex:1;font-size:15px;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rcard .ttl small{font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums}
.rcard .ttl em{font-style:normal;font-size:12px;font-weight:700;color:var(--ink);background:var(--page);padding:5px 10px;border-radius:999px;font-variant-numeric:tabular-nums}

/* 오전/오후 접기 */
.bdh{cursor:pointer;user-select:none;-webkit-user-select:none;padding:12px 0 8px;margin:6px 0 0}
.bdh::after{content:'';margin-left:auto;margin-right:5px;width:8px;height:8px;border:solid var(--sub);border-width:0 2px 2px 0;transform:translateY(-2px) rotate(45deg);transition:transform .2s;align-self:center}
.bdgrp.closed .bdh::after{transform:rotate(-45deg)}
.bdgrp.closed>*:not(.bdh){display:none}
.bdgrp.closed{background:var(--bg);border-radius:16px;padding:0 14px}
.bdgrp.closed .bdh{padding:14px 0;margin:0}
.bdgrp.over{outline-offset:0}

/* ===== v1103b: 밀어서 편집 · 간결화 ===== */
.rate{display:flex;align-items:baseline;gap:10px;margin:-4px 0 14px}
.rate b{font-size:34px;font-weight:700;letter-spacing:-.05em;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.rate span{font-size:13px;font-weight:500;color:var(--sub)}
/* 밀어서 나오는 버튼 */
.swr{position:relative;overflow:hidden;border-bottom:1px solid var(--line);touch-action:pan-y}
.swr>.item,.swr>.sditem,.swr>.big{position:relative;z-index:1;margin:0;border:0;box-shadow:none;background:var(--page);transition:transform .22s cubic-bezier(.2,.8,.2,1)}
.swa{position:absolute;right:0;top:0;bottom:0;display:flex;visibility:hidden;transition:visibility 0s .24s}
.swr.open .swa,.swr.mv .swa{visibility:visible;transition-delay:0s}
.sa{width:74px;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font:inherit;font-size:12px;font-weight:600;color:#fff;background:var(--sub);cursor:pointer}
.sa.d{background:#e5534b}.sa.k{background:var(--accent)}
.sa.pr{background:var(--bg);color:var(--ink)}
.sa .pd{width:10px;height:10px;border-radius:50%;background:#6f93e6}
.sa.pr.p1 .pd{background:#e5534b}.sa.pr.p2 .pd{background:#e8b630}
.bdgrp>.swr:last-child,#sdList>.swr:last-child,#bigs>.swr:last-child{border-bottom:0}
.swr:has(+.swr.sub){border-bottom-color:transparent}
.swr.sub{margin-left:18px;padding-left:14px;border-left:1.5px solid var(--line);border-bottom:0}
.swr.sub>.item.sub{margin:0;padding:10px 0;background:var(--page)}
.item.sub::before{display:none}
/* 체크: 얇은 링 → 채워진 원 */
.wrap input[type=checkbox]{-webkit-appearance:none;appearance:none;width:22px;height:22px;margin:0;flex:none;display:grid;place-items:center;border-radius:50%;border:1.5px solid color-mix(in srgb,var(--sub) 50%,transparent);background:transparent none;box-shadow:none;transition:background .15s,border-color .15s}
.wrap input[type=checkbox]::after{content:'';width:5px;height:10px;border:solid var(--on);border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px) scale(0);transition:transform .15s}
.wrap input[type=checkbox]:checked{background:var(--accent);border-color:var(--accent)}
.wrap input[type=checkbox]:checked::after{transform:rotate(45deg) translate(-1px,-1px) scale(1)}
.item.done,.sditem.done{opacity:1}
.item.done .tx,.sditem.done .tx{color:var(--sub);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--sub) 55%,transparent)}
.item.done .no,.item.done .prog{opacity:.5}
/* 중요도는 점 하나로만 */
.item:not(.sub).p1 .tx::before,.sditem.p1 .tx::before,.item:not(.sub).p2 .tx::before,.sditem.p2 .tx::before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:8px;vertical-align:middle;transform:translateY(-1px)}
.item.p1 .tx::before,.sditem.p1 .tx::before{background:#e5534b}
.item.p2 .tx::before,.sditem.p2 .tx::before{background:#e8b630}
.item.done .tx::before,.sditem.done .tx::before{opacity:.4}
.item .no{font-size:11px;font-weight:600;min-width:16px;color:var(--sub)}
.item.sub .no{min-width:26px}
.hint{font-size:12px;color:var(--sub);margin-top:12px}
/* 오늘의 빅3 */
.swr>.big{display:flex;align-items:center;gap:14px;padding:8px 0}
.big .n{position:relative;width:28px;height:28px;padding:0;border-radius:50%;border:1.5px solid color-mix(in srgb,var(--sub) 45%,transparent);background:transparent;color:var(--sub);font:inherit;font-size:13px;font-weight:600;display:grid;place-items:center;flex:none;transition:background .15s,border-color .15s}
.big.done .n{background:var(--accent);border-color:var(--accent);color:transparent;font-size:0}
.big.done .n::after{content:'';width:5px;height:11px;border:solid var(--on);border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.big input[type=text]{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font-size:16px;font-weight:500;padding:10px 0}
.big.done input[type=text]{color:var(--sub);text-decoration:line-through}
/* 루틴 */
.rhero{display:flex;align-items:center;gap:20px;margin:4px 0 18px}
.ring{--p:0;position:relative;flex:none;width:88px;height:88px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--bg) 0)}
.ring::before{content:'';position:absolute;inset:9px;border-radius:50%;background:var(--page)}
.ring b{position:relative;font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
.rside{display:flex;flex-direction:column;gap:4px}
.rbig{font-size:38px;font-weight:700;letter-spacing:-.05em;line-height:1;font-variant-numeric:tabular-nums}
.rcap{font-size:13px;color:var(--sub)}
#rlist .swr{border:0;border-radius:16px;margin-bottom:8px}
#rlist .swr>.sditem{padding:15px 16px;border-radius:16px;background:var(--bg)}
#rlist .swr>.sditem.done{background:var(--accent)}
#rlist .sditem.done span{color:var(--on)}
#rlist .sditem .rpc{margin-left:auto}
#rlist .sditem.done input[type=checkbox]{background:var(--on);border-color:var(--on)}
#rlist .sditem.done input[type=checkbox]::after{border-color:var(--accent)}

/* v1103c */
.card.hero{border-top:1px solid var(--line);padding-top:22px}
.rng button{display:grid;place-items:center;flex:none;width:44px;height:40px;padding:0;overflow:visible;line-height:1}
.rng button svg{display:block}
.rate{flex-direction:row-reverse;justify-content:space-between;align-items:center;margin:14px 0 6px;padding:16px 18px;border-radius:18px;background:var(--bg)}
.rate b{font-size:30px}
.rate span{font-size:13px;font-weight:600;color:var(--ink)}

/* ===== v1104a: 카드형 새 구성 ===== */
:root{--canvas:#f1f3f6;--page:#fff;--bg:#f2f4f7;--line:#eceff3}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--canvas:#090c10;--page:#141a20;--bg:#1d252d;--line:#232c35;--plan:#242b47;--done:#16403a}}
:root[data-theme="dark"]{--canvas:#090c10;--page:#141a20;--bg:#1d252d;--line:#232c35;--plan:#242b47;--done:#16403a}
body{background:var(--canvas)}
.wrap{padding:16px 14px 150px}
header{margin:6px 4px 18px}
.date{background:var(--page);box-shadow:0 1px 2px rgba(15,23,32,.06)}
.dpick{background:var(--bg);box-shadow:none}
.wd{font-size:28px}
/* 카드 */
.card,.card.hero{background:var(--page);border:0;border-radius:26px;padding:20px 18px 18px;margin-bottom:12px;box-shadow:0 1px 2px rgba(15,23,32,.04)}
.card h2{font-size:16px;font-weight:700;margin:0 0 12px}
.card.over{background:color-mix(in srgb,var(--accent) 10%,var(--page))}
.card.focus{background:color-mix(in srgb,var(--accent) 9%,var(--page))}
.card.focus .swr{border-bottom-color:color-mix(in srgb,var(--accent) 16%,transparent)}
.card.focus .swr>.big{background:color-mix(in srgb,var(--accent) 9%,var(--page))}
.card.focus .big input[type=text]{font-size:17px;font-weight:600}
.card.focus .big .n{border-color:color-mix(in srgb,var(--accent) 55%,transparent);color:var(--accent);background:var(--page)}
.card.focus .big.done .n{background:var(--accent);border-color:var(--accent)}
/* 입력: 목록의 첫 줄처럼 */
.add{align-items:center;gap:10px;margin:0 0 6px;padding:0 0 10px;border-bottom:1px solid var(--line)}
.add input{background:transparent;border-radius:0;padding:8px 0;font-size:15px}
.add input::placeholder{color:var(--sub)}
.add input{flex:1 1 0;width:0;min-width:0}
.add button{order:-1;width:30px;height:30px;border-radius:50%;background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}
.add button svg{width:16px;height:16px}
.add .cats{order:1;flex:none;margin:0;padding:3px;gap:0;border-radius:999px;background:var(--bg)}
.add .cats button{order:0;width:auto;height:auto;flex:none;padding:6px 12px;border-radius:999px;font-size:12px;font-weight:600;background:transparent;color:var(--sub)}
.add .cats button.on{background:var(--pri);color:var(--onpri)}
.add .cats button svg{display:none}
/* 목록 */
.bdh{font-size:13px;font-weight:700;margin:14px 0 0;padding:10px 0 6px}
.bdh i{font-size:12px}
.hint{font-size:11.5px;color:var(--sub);opacity:.85;margin-top:10px}
.swr>.item,.swr>.sditem{padding:12px 0}
.bdgrp.closed{background:var(--bg)}
/* 시간표 */
.card.hero .gscroll{background:var(--bg);border-radius:20px}
.rate{background:var(--bg)}
.pdfbtn{background:var(--page);color:var(--sub);font-weight:600;box-shadow:0 1px 2px rgba(15,23,32,.04)}
/* 루틴 */
.rcard{background:var(--page);box-shadow:0 1px 2px rgba(15,23,32,.04);border-radius:26px}
.cal i{background:var(--bg)}
.cal i.blank{background:transparent}
.rcard .ttl em{background:var(--bg)}
.mnav button{background:var(--page)}
/* 탭바 */
.tabs{box-shadow:0 10px 30px rgba(15,23,32,.14),0 0 0 1px var(--line)}

/* v1104b 검색 */
.card{position:relative}
.sbtn{position:absolute;top:15px;right:46px;width:36px;height:36px;border:0;border-radius:50%;background:transparent;color:var(--sub);display:grid;place-items:center;padding:0}
.sbtn.on{background:var(--bg);color:var(--ink)}
.card.closed .sbtn{display:none}
.sbox{display:flex;align-items:center;gap:8px;margin:0 0 10px;padding:0 6px 0 14px;border-radius:14px;background:var(--bg);color:var(--sub)}
.sbox[hidden],#bdRes[hidden]{display:none}
.sbox svg{flex:none}
.sbox input::-webkit-search-cancel-button,.sbox input::-webkit-search-decoration{-webkit-appearance:none;appearance:none;display:none}
.sbox input{flex:1 1 0;width:0;min-width:0;border:0;outline:0;background:transparent;color:var(--ink);font:inherit;font-size:15px;padding:13px 0}
.sbox small{flex:none;font-size:12px;font-weight:600}
.sbox button{flex:none;width:32px;height:32px;border:0;background:transparent;color:var(--sub);font-size:20px;line-height:1}
.card.sq .add,.card.sq .hint,.card.sq #items{display:none}
.sr{padding:12px 0;border-bottom:1px solid var(--line)}
.sr:last-child{border-bottom:0}
.sr .st{font-size:15px;font-weight:500}
.sr.dn .st{color:var(--sub);text-decoration:line-through}
.sr .ss{margin:6px 0 0 6px;font-size:13px;color:var(--sub)}
.sr .mt{margin-top:4px;font-size:11.5px;color:var(--sub)}
.sr mark{background:color-mix(in srgb,var(--accent) 24%,transparent);color:inherit;border-radius:4px;padding:0 1px}

/* v1104c */
.sbtn{right:14px}
.card.closed>*:not(h2){display:none}

/* v1104d */
.sa small{display:block;font-size:10px;font-weight:500;opacity:.85;line-height:1}
.sa.k2{background:#5b6fd6}

/* v1104e: 날짜 바꾸기 */
.item .dt{flex:none;font-size:11px;font-weight:600;color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent);padding:3px 8px;border-radius:999px}
.sheetbk{position:fixed;inset:0;z-index:300;background:rgba(10,14,18,.42);display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .2s}
.sheet{width:100%;max-width:520px;background:var(--page);border-radius:26px 26px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom,0px));animation:sheetUp .26s cubic-bezier(.2,.8,.2,1)}
.sht{font-size:18px;font-weight:700;letter-spacing:-.02em}
.shs{margin:4px 0 16px;font-size:13px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.shc{border:0;border-radius:16px;background:var(--bg);color:var(--ink);padding:14px 4px 12px;font:inherit;display:flex;flex-direction:column;align-items:center;gap:4px}
.shc b{font-size:15px;font-weight:600}
.shc small{font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums}
.shc.on{background:var(--pri);color:var(--onpri)}
.shc.on small{color:var(--onpri);opacity:.75}
.shd{display:flex;align-items:center;justify-content:space-between;margin-top:10px;padding:10px 14px;border-radius:16px;background:var(--bg);font-size:14px;font-weight:500}

.shx{width:100%;margin-top:10px;border:0;background:transparent;color:var(--sub);font:inherit;font-weight:600;padding:12px}

<script>
var START=6*60,END=24*60,STEP=30,KEY='timebox:';
var $=function(id){return document.getElementById(id)};
function fmt(d){return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function today(){return fmt(new Date())}
var cur=today();
function defRange(day){var wd=new Date(day+'T00:00:00').getDay();return (wd===0||wd===6)?{s:360,e:1440}:{s:1140,e:1380}}
function fitRange(d){
  var lo=d.range.s,hi=d.range.e;
  ['plan','done'].forEach(function(k){Object.keys(d[k]||{}).forEach(function(x){if(d[k][x]){var n=+x;if(n<lo)lo=n;if(n+STEP>hi)hi=n+STEP}})});
  d.range={s:Math.max(0,Math.floor(lo/STEP)*STEP),e:Math.min(1440,hi)};
}
var BDK='timebox:bd',BD=loadBD();
function loadBD(){
  try{var r=localStorage.getItem(BDK);if(r){var o=JSON.parse(r);if(o&&o.items){o.items.forEach(function(it){if(!it.from)it.from=today()});return o}}}catch(e){}
  var all=[],seen={};
  try{
    var keys=[];for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(/^timebox:\d{4}-\d\d-\d\d$/.test(k))keys.push(k)}
    keys.sort().forEach(function(k){
      var d=JSON.parse(localStorage.getItem(k)||'{}'),day=k.slice(8);
      (d.items||[]).forEach(function(it){
        if(!it||!it.t)return;
        if(it.c){it.cd=day;it.from=day;all.push(it)}
        else{var sig=icat(it)+'|'+it.t;if(!seen[sig]){seen[sig]=1;it.from=day;all.push(it)}}
      });
    });
  }catch(e){}
  var o={items:all};try{localStorage.setItem(BDK,JSON.stringify(o))}catch(e){}return o;
}
function bdVis(it){return (!it.from||it.from<=cur)&&(!it.c||!it.cd||it.cd===cur)}
function blank(){return {big:[{t:'',c:false},{t:'',c:false},{t:'',c:false}],items:[],plan:{},done:{},rv:{mood:0,good:'',bad:'',learn:'',tomorrow:'',diary:''}}}
function load(day){
  try{
    var r=localStorage.getItem(KEY+day);
    if(r){
      var d=JSON.parse(r);
      d.items=BD.items;
      if(!d.rv)d.rv={mood:0,good:'',bad:'',learn:'',tomorrow:'',diary:''};
      ['plan','done'].forEach(function(k){
        var o={};Object.keys(d[k]||{}).forEach(function(x){var n=+x;o[n<100?n*60:n]=d[k][x]});d[k]=o;
      });
      if(!d.range)d.range={s:360,e:1440};
      fitRange(d);
      return d;
    }
  }catch(e){}
  var b=blank();b.items=BD.items;b.range=defRange(day);return b;
}
var data=load(cur);
function save(){try{var o=Object.assign({},data);o.items=[];localStorage.setItem(KEY+cur,JSON.stringify(o));localStorage.setItem(BDK,JSON.stringify({items:BD.items}))}catch(e){}stats()}
function cnt(o){return Object.keys(o).filter(function(k){return o[k]}).length}
function stats(){
  var pr=planRate(data);
  if($('sRate')){$('sRate').textContent=pr.pct+'%';$('sRateSub').textContent='계획대로 실행 · '+pr.mt+'/'+pr.tot+'칸'}
  reviewSum();
}
function planRate(d){
  var tot=Math.max(1,Math.round((d.range.e-d.range.s)/STEP));
  var mt=Object.keys(d.plan).filter(function(k){return d.plan[k]&&d.done[k]===d.plan[k]}).length;
  return {mt:mt,tot:tot,pct:Math.min(100,Math.round(mt/tot*100))};
}
function hhmm(m){return ('0'+Math.floor(m/60)).slice(-2)+':'+('0'+(m%60)).slice(-2)}

/* ---- 밀어서 편집 ---- */
var openSw=null;
function swClose(){if(openSw){openSw.w.classList.remove('open');openSw.row.style.transform='';openSw=null}}
document.addEventListener('pointerdown',function(e){if(openSw&&!openSw.w.contains(e.target))swClose()},true);
function mkSw(row,acts){
  var w=mk('div','swr'+(row.classList.contains('sub')?' sub':'')),bar=mk('div','swa'),W=acts.reduce(function(n,a){return n+(a.w||74)},0);
  bar.style.width=W+'px';
  acts.forEach(function(a){
    var b=mk('button','sa '+(a.cls||''));b.type='button';if(a.w)b.style.width=a.w+'px';
    if(a.html)b.innerHTML=a.html;else b.textContent=a.label;
    b.onclick=function(e){e.stopPropagation();a.fn(b)};bar.appendChild(b);
  });
  w.appendChild(bar);w.appendChild(row);
  var x0=0,y0=0,base=0,st=0,pid=null,tx=0;
  w.addEventListener('pointerdown',function(e){
    if(e.target.closest('.swa')||drag)return;
    if(openSw&&openSw.w!==w)swClose();
    x0=e.clientX;y0=e.clientY;base=w.classList.contains('open')?-W:0;st=1;pid=e.pointerId;tx=base;
  });
  w.addEventListener('pointermove',function(e){
    if(!st||drag||e.pointerId!==pid)return;
    var dx=e.clientX-x0,dy=e.clientY-y0;
    if(st===1){
      if(Math.abs(dy)>10&&Math.abs(dy)>Math.abs(dx)){st=0;return}
      if(Math.abs(dx)>10&&Math.abs(dx)>Math.abs(dy)*1.2){st=2;clearTimeout(timer);timer=null;w.classList.add('mv');try{w.setPointerCapture(pid)}catch(_){}row.style.transition='none'}
      else return;
    }
    tx=Math.max(-W,Math.min(0,base+dx));row.style.transform='translateX('+tx+'px)';
  });
  function fin(){
    if(st===2){
      var open=tx<-W/2;row.style.transition='';row.style.transform=open?'translateX('+(-W)+'px)':'';
      w.classList.toggle('open',open);
      if(open)openSw={w:w,row:row};else if(openSw&&openSw.w===w)openSw=null;
      w._sw=Date.now();
    }
    w.classList.remove('mv');st=0;
  }
  w.addEventListener('pointerup',fin);w.addEventListener('pointercancel',fin);
  w.addEventListener('click',function(e){
    if(e.target.closest('.swa'))return;
    if(Date.now()-(w._sw||0)<350){e.stopPropagation();e.preventDefault();return}
    if(w.classList.contains('open')){e.stopPropagation();e.preventDefault();swClose()}
  },true);
  return w;
}
function renderBigs(){
  var bigs=$('bigs');bigs.innerHTML='';openSw=null;
  data.big.forEach(function(b,i){
    var row=mk('div','big'+(b.c?' done':''));
    var n=mk('button','n',String(i+1));n.type='button';n.setAttribute('aria-label','완료 표시');
    n.onclick=function(){data.big[i].c=!data.big[i].c;row.className='big'+(data.big[i].c?' done':'');save()};
    var t=mk('input');t.type='text';t.placeholder='중요한 일 '+(i+1);t.value=b.t;
    t.oninput=function(){data.big[i].t=t.value;save()};
    row.appendChild(n);row.appendChild(t);
    bigs.appendChild(mkSw(row,[{label:'지우기',cls:'d',fn:function(){data.big[i]={t:'',c:false};save();renderBigs()}}]));
  });
}
var lastTap=0,lastId='';
function bindEdit(row,s,key,getT,setT,after){
  s.style.touchAction='pan-y';
  s.onclick=function(){
    var n=Date.now();
    if(lastId===key&&n-lastTap<400){lastTap=0;edit()}else{lastTap=n;lastId=key}
  };
  function edit(){
    var inp=document.createElement('input');inp.type='text';inp.value=getT();
    inp.style.cssText='flex:1;min-width:0;border:0;border-bottom:1px solid var(--accent);background:transparent;color:var(--ink);font:inherit;outline:none';
    row.replaceChild(inp,s);inp.focus();inp.select();
    var fin=false;
    function done(ok){if(fin)return;fin=true;var v=inp.value.trim();if(ok&&v)setT(v);after()}
    inp.onkeydown=function(e){if(e.key==='Enter'&&!e.isComposing)done(true);else if(e.key==='Escape')done(false)};
    inp.onblur=function(){done(true)};
  }
}
function cyc(p){return {3:2,2:1,1:3}[p||3]}
function orderP(a){var idx=a.map(function(_,i){return i}),key=function(i){return (a[i].c?10:0)+(a[i].p||3)};return idx.sort(function(x,y){return key(x)-key(y)||x-y})}
function order(a){var u=[],c=[];a.forEach(function(x,i){(x.c?c:u).push(i)});return u.concat(c)}
var CATS=[['work','오전'],['life','오후']],bdCat='work',subOpen=-1,BDF={};
try{BDF=JSON.parse(localStorage.getItem('timebox:bdfold')||'{}')}catch(e){}
try{bdCat=localStorage.getItem('timebox:bdcat')==='life'?'life':'work'}catch(e){}
function icat(it){return it&&it.cat==='life'?'life':'work'}
function renderCatSel(){[].forEach.call($('catSel').children,function(b){b.className=b.dataset.c===bdCat?'on':''})}
[].forEach.call($('catSel').children,function(b){b.onclick=function(){bdCat=b.dataset.c;try{localStorage.setItem('timebox:bdcat',bdCat)}catch(e){}renderCatSel()}});

/* 브레인덤프 검색 */
function bdMD(d){return d?(+d.slice(5,7))+'/'+(+d.slice(8,10)):''}
function bdHL(el,txt,q){
  var i=txt.toLowerCase().indexOf(q);
  if(i<0){el.textContent=txt;return}
  el.appendChild(document.createTextNode(txt.slice(0,i)));
  var m=document.createElement('mark');m.textContent=txt.slice(i,i+q.length);el.appendChild(m);
  el.appendChild(document.createTextNode(txt.slice(i+q.length)));
}
function bdSearch(){
  var q=($('bdQ').value||'').trim().toLowerCase(),card=$('items').closest('.card'),res=$('bdRes');
  var on=!$('bdSBox').hidden&&q.length>0;
  card.classList.toggle('sq',on);res.hidden=!on;res.innerHTML='';$('bdCnt').textContent='';
  if(!on)return;
  var hits=[];
  data.items.forEach(function(it){
    var self=it.t.toLowerCase().indexOf(q)>-1,subs=(it.sub||[]).filter(function(sb){return sb.t.toLowerCase().indexOf(q)>-1});
    if(self||subs.length)hits.push({it:it,self:self,subs:subs});
  });
  hits.sort(function(a,b){return (a.it.c?1:0)-(b.it.c?1:0)||String(b.it.from||'').localeCompare(String(a.it.from||''))});
  $('bdCnt').textContent=hits.length+'건';
  if(!hits.length){res.appendChild(mk('div','empty','검색 결과가 없어요'));return}
  hits.forEach(function(h){
    var it=h.it,r=mk('div','sr'+(it.c?' dn':'')),t=mk('div','st');bdHL(t,it.t,q);r.appendChild(t);
    h.subs.forEach(function(sb){var l=mk('div','ss');l.appendChild(document.createTextNode('└ '));bdHL(l,sb.t,q);r.appendChild(l)});
    var meta=[icat(it)==='life'?'오후':'오전'];
    if(it.from)meta.push(bdMD(it.from)+' 부터');
    meta.push(it.c?('완료'+(it.cd?' '+bdMD(it.cd):'')):'진행 중');
    r.appendChild(mk('div','mt',meta.join(' · ')));
    res.appendChild(r);
  });
}
function bdSOpen(open){
  $('bdSBox').hidden=!open;$('bdSBtn').classList.toggle('on',open);
  if(open)$('bdQ').focus();else $('bdQ').value='';
  bdSearch();
}
$('bdSBtn').onclick=function(e){e.stopPropagation();bdSOpen($('bdSBox').hidden)};
$('bdQx').onclick=function(){bdSOpen(false)};
$('bdQ').oninput=bdSearch;
$('bdQ').onkeydown=function(e){if(e.key==='Escape')bdSOpen(false)};

/* 브레인덤프: 보이는 날짜 바꾸기 */
function bdAddDays(d,n){var x=new Date(d+'T00:00:00');x.setDate(x.getDate()+n);return x.getFullYear()+'-'+('0'+(x.getMonth()+1)).slice(-2)+'-'+('0'+x.getDate()).slice(-2)}
var toastT=null;
function toast(msg){
  var t=$('toast');if(!t){t=mk('div','toast');t.id='toast';document.body.appendChild(t)}
  t.textContent=msg;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('on')},2200);
}
function bdDateSheet(it){
  var bk=mk('div','sheetbk'),sh=mk('div','sheet');
  function close(){bk.remove()}
  function apply(d){
    it.from=d;save();close();renderItems();
    toast(d>cur?bdMD(d)+'부터 보여요':bdMD(d)+'부터 다시 보여요');
  }
  sh.appendChild(mk('div','sht','언제부터 보일까요?'));
  sh.appendChild(mk('div','shs',it.t));
  var grid=mk('div','shg');
  [['오늘',0],['내일',1],['모레',2],['3일 뒤',3],['일주일 뒤',7],['2주 뒤',14]].forEach(function(o){
    var d=bdAddDays(cur,o[1]),b=mk('button','shc'+(d===it.from?' on':''));b.type='button';
    b.appendChild(mk('b','',o[0]));b.appendChild(mk('small','',bdMD(d)));
    b.onclick=function(){apply(d)};grid.appendChild(b);
  });
  sh.appendChild(grid);
  var lab=mk('label','shd');lab.appendChild(mk('span','','날짜 직접 고르기'));
  var di=mk('input');di.type='date';di.value=it.from||cur;di.onchange=function(){if(di.value)apply(di.value)};
  lab.appendChild(di);sh.appendChild(lab);
  var x=mk('button','shx','닫기');x.type='button';x.onclick=close;sh.appendChild(x);
  bk.onclick=function(e){if(e.target===bk)close()};
  bk.appendChild(sh);document.body.appendChild(bk);
}
function mk(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
function renderItems(){
  var box=$('items');box.innerHTML='';renderCatSel();openSw=null;

var timer=null,drag=null,sx=0,sy=0,lx=0,ly=0,scrollT=null,overEl=null;
function begin(row){
  var src=row.classList.contains('cell')?'cell':(row.classList.contains('item')?(row.classList.contains('sub')?'sub':'bd'):'sd'),it,info;
  if(src==='cell'){
    var tx=row.textContent.trim();if(!tx)return;
    it={t:tx};info={t:row.dataset.t,k:row.dataset.k};
    try{if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();window.getSelection().removeAllRanges()}catch(e){}
  }else{
    it=src==='sub'?(data.items[+row.dataset.i]||{sub:[]}).sub[+row.dataset.j]:(src==='bd'?data.items:SD)[+row.dataset.i];if(!it)return;info={};
  }
  var gh=document.createElement('div');gh.className='ghost';gh.textContent=it.t;document.body.appendChild(gh);
  drag={src:src,idx:+row.dataset.i,j:+row.dataset.j,gh:gh,t:info.t,k:info.k};row.style.opacity='.4';
  if(navigator.vibrate)try{navigator.vibrate(15)}catch(e){}
  place(lx,ly);
  scrollT=setInterval(function(){
    var sc=$('gscroll'),r=sc.getBoundingClientRect(),inner=false;
    if(lx>=r.left&&lx<=r.right&&ly>=r.top&&ly<=r.bottom){
      if(ly<r.top+44){sc.scrollTop-=10;inner=true}else if(ly>r.bottom-44){sc.scrollTop+=10;inner=true}
    }
    if(!inner){if(ly<90)window.scrollBy(0,-14);else if(ly>window.innerHeight-90)window.scrollBy(0,14)}
    hit()},30);
}
function place(x,y){if(!drag)return;drag.gh.style.left=x+'px';drag.gh.style.top=y+'px'}
function hit(){
  if(!drag)return;
  var el=document.elementFromPoint(lx,ly),c=null;
  if(el&&el.closest){
    var cd=el.closest('.card');
    if(drag.src==='cell'){var cc=el.closest('.cell');c=cc&&cc.dataset.t===drag.t&&cc.dataset.k!==drag.k?cc:null;if(!c&&drag.t==='plan'){c=el.closest('.bdgrp')||(cd&&cd===$('items').closest('.card')?cd:null)}}
    else if(drag.src==='sub')c=el.closest('.cell.p');
    else if(drag.src==='bd'){
      var it0=data.items[drag.idx],hasSub=it0&&it0.sub&&it0.sub.length,grp=el.closest('.bdgrp');
      c=grp&&grp.dataset.cat!==icat(it0)?grp:null;
      if(!c&&!hasSub)c=el.closest('.cell.p')||(cd&&cd===$('sdList').closest('.card')?cd:null);
    }else{var g2=el.closest('.bdgrp');c=g2||(cd&&cd===$('items').closest('.card')?cd:null)}
  }
  if(overEl&&overEl!==c)overEl.classList.remove('over');
  if(c)c.classList.add('over');
  overEl=c;
}
function end(drop){
  clearTimeout(timer);timer=null;
  if(!drag)return;
  clearInterval(scrollT);
  if(drop&&overEl){
    if(drag.src==='sub'){
      var par=data.items[drag.idx],sb=par&&par.sub[drag.j];
      if(sb){var kk=overEl.dataset.k;data.plan[kk]=data.plan[kk]?data.plan[kk]+' / '+sb.t:sb.t;par.sub.splice(drag.j,1)}
    }else if(drag.src==='cell'&&!overEl.classList.contains('cell')){
      var pk2=drag.k,ptx=data.plan[pk2];
      if(ptx){data.items.push({t:ptx,c:false,from:cur,p:3,cat:overEl.dataset.cat||bdCat,sub:[]});delete data.plan[pk2]}
    }else if(drag.src==='cell'){
      var tt=drag.t,fk=drag.k,tk=overEl.dataset.k,txt=data[tt][fk];
      if(txt){data[tt][tk]=data[tt][tk]?data[tt][tk]+' / '+txt:txt;delete data[tt][fk]}
    }else if(overEl.classList.contains('cell')){
      var k=overEl.dataset.k,it=data.items[drag.idx];
      if(it){data.plan[k]=data.plan[k]?data.plan[k]+' / '+it.t:it.t;data.items.splice(drag.idx,1)}
    }else if(drag.src==='bd'&&overEl.classList.contains('bdgrp')){
      var a0=data.items[drag.idx];if(a0)a0.cat=overEl.dataset.cat;
    }else if(drag.src==='bd'){
      var a=data.items[drag.idx];
      if(a){SD.push({t:a.t,c:a.c,p:a.p||3});data.items.splice(drag.idx,1);saveSD()}
    }else{
      var b=SD[drag.idx];
      if(b){data.items.push({t:b.t,c:b.c,from:cur,cd:b.c?cur:undefined,p:b.p||3,cat:overEl.dataset.cat||bdCat,sub:[]});SD.splice(drag.idx,1);saveSD()}
    }
    save();
  }
  if(overEl)overEl.classList.remove('over');
  drag.gh.remove();drag=null;overEl=null;
  renderItems();renderSD();renderGrid();
}
function down(e,x,y){
  var row=e.target.closest&&(e.target.closest('.item')||e.target.closest('#sdList .sditem'));
  if(!row&&e.target.closest){var cl=e.target.closest('.cell');if(cl&&cl.textContent.trim()&&document.activeElement!==cl)row=cl}

}

  el.innerHTML='<span>BIG 3<b>'+c+'/3</b></span><span>계획대로<b>'+pr.pct+'%</b></span><span>루틴<b>'+(st.t?st.d+'/'+st.t:'—')+'</b></span>';
}
function renderReview(){
  var rv=data.rv,box=$('moods');box.innerHTML='';
  MOODS.forEach(function(e,i){
    var b=document.createElement('button');b.textContent=e;b.className=rv.mood===i+1?'on':'';
    b.onclick=function(){rv.mood=rv.mood===i+1?0:i+1;save();renderReview()};
    box.appendChild(b);
  });
  [['rvGood','good'],['rvBad','bad'],['rvLearn','learn'],['rvTmr','tomorrow'],['rvDiary','diary']].forEach(function(q){
    var t=$(q[0]);t.value=rv[q[1]]||'';t.oninput=function(){rv[q[1]]=t.value;save()};
  });
  reviewSum();
}

/* 루틴 이름 수정 */
function editName(r,span){
  var inp=document.createElement('input');inp.type='text';inp.value=r.name;
  inp.style.cssText='flex:1;min-width:0;border:0;border-bottom:1px solid var(--accent);background:transparent;color:var(--ink);font:inherit;outline:none;padding:2px 0';
  var done=false;
  function finish(ok){
    if(done)return;done=true;
    var v=inp.value.trim();
    if(ok&&v&&v!==r.name){r.name=v;saveR()}
    renderRoutine();
  }
  inp.onkeydown=function(e){if(e.isComposing)return;if(e.key==='Enter')finish(true);else if(e.key==='Escape')finish(false)};
  inp.onblur=function(){finish(true)};
  span.replaceWith(inp);inp.focus();inp.select();
}

/* 계획 탭 카테고리 접기 */
var FK='timebox:fold',FOLD={};
try{FOLD=JSON.parse(localStorage.getItem(FK)||'{}')}catch(e){}
[].forEach.call(document.querySelectorAll('#pane1 .card'),function(card){
  var h=card.querySelector('h2');if(!h||h.dataset.nf)return;
  var id=h.dataset.k||h.textContent.trim();

});

/* 옆으로 밀어서 탭 전환 */
var sw=$('swipe'),panes=[$('pane1'),$('pane2'),$('pane3')],tabs=document.querySelectorAll('.tab');
function fit(){
  var i=sw.clientWidth?Math.min(2,Math.round(sw.scrollLeft/sw.clientWidth)):0;
  sw.style.height=panes[i].scrollHeight+'px';
  for(var k=0;k<tabs.length;k++)tabs[k].classList.toggle('on',k===i);
  reviewSum();
}
sw.addEventListener('scroll',fit,{passive:true});
window.addEventListener('resize',fit);
for(var k=0;k<tabs.length;k++)(function(k){tabs[k].onclick=function(){sw.scrollTo({left:k*sw.clientWidth,behavior:'smooth'})}})(k);
if(window.ResizeObserver){var ro=new ResizeObserver(fit);panes.forEach(function(p){ro.observe(p)})}
setTimeout(fit,0);

function go(delta){var d=new Date(cur+'T00:00:00');d.setDate(d.getDate()+delta);cur=fmt(d);data=load(cur);render()}
$('prev').onclick=function(){go(-1)};
$('next').onclick=function(){go(1)};

/* PDF 저장 */
var dl=null;
(async function(){
  try{if(window.claude&&claude.use)dl=await claude.use('downloads')}catch(e){dl=null}
})();
function esc(s){return String(s||'').replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function pdfCal(r){
  var y=+cur.slice(0,4),m=+cur.slice(5,7)-1,last=new Date(y,m+1,0).getDate(),first=new Date(y,m,1).getDay(),td=today(),ym=cur.slice(0,7),cells=[];
  for(var b=0;b<first;b++)cells.push('');
  for(var d=1;d<=last;d++){
    var ds=ym+'-'+('0'+d).slice(-2),ok=ds>=r.from&&ds<=td,on=(R.log[ds]||[]).indexOf(r.id)>-1;
    cells.push('<td style="height:22px;text-align:center;font-size:10px;border:2px solid #f5f7fa;border-radius:7px;'+(on?'background:#0a8579;color:#fff;font-weight:700':(ok?'background:#e6eaef;color:#7b8794':'background:#fff;color:#c3cad2'))+'">'+d+'</td>');
  }
  var h='<table style="width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed">';
  for(var i=0;i<cells.length;i+=7){
    var row=cells.slice(i,i+7);while(row.length<7)row.push('');
    h+='<tr>'+row.map(function(c){return c||'<td></td>'}).join('')+'</tr>';
  }
  return h+'</table>';
}
function buildPdfRoot(){
  var root=document.createElement('div');
  root.id='pdfRoot';
  root.style.cssText='position:fixed;left:-10000px;top:0;width:794px;background:#fff;color:#1b2430;padding:0 44px;box-sizing:border-box;font-family:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;font-size:13px;line-height:1.5';
  var INK='#1b2430',SB='#8a94a1',AC='#0a8579',LN='#e9edf1',PC={1:'#e5534b',2:'#e8b630'};
  var c=data.big.filter(function(b){return b.c}).length;
  var pr=planRate(data),st=dayStat(cur),dd=new Date(cur+'T00:00:00'),wd=DN[dd.getDay()];
  var ring=function(on){return '<span style="display:inline-block;width:14px;height:14px;border-radius:50%;box-sizing:border-box;vertical-align:-2px;margin-right:11px;'+(on?'background:'+AC:'border:1.5px solid #c4ccd4')+'"></span>'};
  var row=function(on,t,p,ind,no){
    return '<div class="blk" style="padding:8px 0 8px '+(ind||0)+'px;border-bottom:1px solid '+LN+';'+(on?'color:'+SB+';text-decoration:line-through':'')+'">'+ring(on)
      +(no?'<span style="display:inline-block;min-width:26px;font-size:11px;color:'+SB+'">'+no+'</span>':'')
      +(p&&p<3?'<span style="display:inline-block;color:'+PC[p]+';font-size:9px;margin-right:7px">●</span>':'')+esc(t||'—')+'</div>';
  };
  var sec=function(t,cls){return '<div class="'+(cls||'')+'" style="font-size:17px;font-weight:700;margin:34px 0 6px;color:'+INK+'"><span style="display:inline-block;width:6px;height:17px;border-radius:3px;background:'+AC+';vertical-align:-3px;margin-right:10px"></span>'+t+'</div>'};
  var sub=function(t,n){return '<div class="blk" style="font-size:12px;font-weight:600;color:'+SB+';margin:18px 0 0">'+t+(n!=null?' <span style="font-weight:500;margin-left:4px">'+n+'</span>':'')+'</div>'};
  var tile=function(l,v,s,hot){return '<div style="flex:1;border-radius:14px;padding:14px 16px;'+(hot?'background:'+AC+';color:#fff':'background:#f3f5f8;color:'+INK)+'"><div style="font-size:11px;opacity:.75">'+l+'</div><div style="font-size:26px;font-weight:700;letter-spacing:-1px;line-height:1.2;margin-top:2px">'+v+'</div><div style="font-size:11px;opacity:.75;min-height:16px">'+(s||'')+'</div></div>'};
  var h='<div class="blk" style="padding-top:6px;font-size:12px;font-weight:600;color:'+SB+'">Timeboxing</div>';
  h+='<div class="blk" style="font-size:34px;font-weight:700;letter-spacing:-1.5px;margin:4px 0 0;line-height:1.25">'+(dd.getMonth()+1)+'월 '+dd.getDate()+'일 '+wd+'요일</div>';
  h+='<div class="blk" style="font-size:12px;color:'+SB+'">'+dd.getFullYear()+'</div>';
  h+='<div class="blk" style="display:flex;gap:10px;margin:20px 0 0">'+tile('오늘의 빅3',c+'/3','')+tile('계획대로 실행',pr.pct+'%',pr.mt+'/'+pr.tot+'칸',1)+tile('루틴',st.d+'/'+st.t,st.p===null?'':st.p+'%')+'</div>';

  h+=sec('오늘의 빅3');
  data.big.forEach(function(b,i){h+=row(b.c,b.t,0,0,String(i+1))});
  h+=sec('언젠가 할일');
  if(!SD.length)h+='<div class="blk" style="color:#b3bac3;padding:8px 0">—</div>';
  orderP(SD).forEach(function(i){var it=SD[i];h+=row(it.c,it.t,it.p||3)});
  h+=sec('브레인덤프');
  CATS.forEach(function(cg){
    var idx=orderP(data.items).filter(function(i){return icat(data.items[i])===cg[0]&&bdVis(data.items[i])});
    h+=sub(cg[1],idx.length);
    if(!idx.length)h+='<div class="blk" style="color:#b3bac3;padding:8px 0">—</div>';
    idx.forEach(function(i,n){
      var it=data.items[i];h+=row(it.c,it.t,it.p||3,0,String(n+1));
      (it.sub||[]).forEach(function(sb,j){h+=row(sb.c,sb.t,0,26,(n+1)+'-'+(j+1))});
    });
  });
  h+=sec('시간표');
  h+='<table style="width:calc(100% + 12px);margin:0 -6px;border-collapse:separate;border-spacing:6px 4px;table-layout:fixed"><colgroup><col style="width:56px"><col><col></colgroup>';
  h+='<tr class="cut"><td></td><td style="height:24px;text-align:center;font-size:12px;font-weight:600;color:#6b7ae0">● 계획</td><td style="text-align:center;font-size:12px;font-weight:600;color:'+AC+'">● 실행</td></tr>';
  for(var m=data.range.s;m<data.range.e;m+=STEP){
    var pl=data.plan[m],dn=data.done[m];
    h+='<tr class="cut"><td style="height:28px;font-size:11px;color:'+SB+';vertical-align:middle">'+hhmm(m)+'</td>'
      +'<td style="border-radius:8px;padding:4px 10px;word-break:break-word;background:'+(pl?'#e4e9fb':'#f5f7fd')+'">'+esc(pl)+'</td>'
      +'<td style="border-radius:8px;padding:4px 10px;word-break:break-word;background:'+(dn?'#d5f0ea':'#f3faf8')+'">'+esc(dn)+'</td></tr>';
  }
  h+='</table>';

  h+=sec('오늘의 루틴','pb');
  var act=R.list.filter(function(r){return r.from<=cur}),ids=R.log[cur]||[],ym=cur.slice(0,7);
  if(!act.length)h+='<div class="blk" style="color:#b3bac3;padding:8px 0">—</div>';
  act.forEach(function(r){
    var on=ids.indexOf(r.id)>-1,rr=rRate(r,ym);
    h+='<div class="blk" style="display:flex;align-items:center;padding:8px 0;border-bottom:1px solid '+LN+';'+(on?'color:'+SB+';text-decoration:line-through':'')+'">'+ring(on)+'<span style="flex:1">'+esc(r.name)+'</span><span style="display:inline-block;font-size:12px;color:'+SB+'">'+(rr.pct===null?'':rr.pct+'%')+'</span></div>';
  });
  h+=sub('월간 기록',(+cur.slice(0,4))+'년 '+(+cur.slice(5,7))+'월');
  if(!R.list.length)h+='<div class="blk" style="color:#b3bac3;padding:8px 0">—</div>';
  h+='<div style="display:flex;flex-wrap:wrap;gap:12px;margin-top:10px">';
  R.list.forEach(function(r){
    var rr=rRate(r,ym);
    h+='<div class="blk" style="width:calc((100% - 24px)/3);box-sizing:border-box;background:#f5f7fa;border-radius:14px;padding:12px"><div style="display:flex;align-items:center;margin-bottom:8px"><span style="flex:1;font-weight:700;font-size:12px">'+esc(r.name)+'</span><span style="font-size:11px;font-weight:700;color:'+AC+'">'+(rr.pct===null?'':rr.pct+'%')+'</span></div>'+pdfCal(r)+'</div>';
  });
  h+='</div>';

  root.innerHTML=h;
  document.body.appendChild(root);
  return root;
}
async function makePdf(){
  var root=buildPdfRoot(),S=2;
  try{
    var rt=root.getBoundingClientRect().top;
    var cuts=[].map.call(root.querySelectorAll('tr.cut,.blk'),function(el){return Math.round((el.getBoundingClientRect().bottom-rt)*S)});
    var tops=[].map.call(root.querySelectorAll('.pb'),function(el){return Math.round((el.getBoundingClientRect().top-rt)*S)});
    var canvas=await html2canvas(root,{scale:S,backgroundColor:'#ffffff',windowWidth:794,scrollX:0,scrollY:0,
      onclone:function(doc){var r=doc.getElementById('pdfRoot');if(r){r.style.left='0';r.style.top='0'}}});
    var pdf=new window.jspdf.jsPDF('p','mm','a4');
    var pw=210,mg=14,perPage=Math.floor(canvas.width*(297-2*mg)/210),y=0,first=true;
    while(y<canvas.height){
      var h=Math.min(perPage,canvas.height-y),pb=0;
      tops.forEach(function(t){if(t>y+10&&t<=y+perPage&&(!pb||t<pb))pb=t});
      if(pb)h=pb-y;
      else if(y+h<canvas.height){
        var best=0;cuts.forEach(function(c){if(c>y+perPage*0.5&&c<=y+perPage)best=c});
        if(best)h=best-y;
      }
      var c=document.createElement('canvas');c.width=canvas.width;c.height=h;
      var ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,h);
      ctx.drawImage(canvas,0,y,canvas.width,h,0,0,canvas.width,h);
      if(!first)pdf.addPage();
      pdf.addImage(c.toDataURL('image/jpeg',0.92),'JPEG',0,mg,pw,h*pw/canvas.width);
      first=false;y+=h;
    }
    return pdf.output('blob');
  }finally{root.remove()}
}
$('pdfBtn').onclick=async function(){
  var b=$('pdfBtn'),label='PDF로 저장';
  if(!window.html2canvas||!window.jspdf){b.textContent='PDF 도구를 불러오지 못했어요';setTimeout(function(){b.textContent=label},2500);return}
  b.disabled=true;b.textContent='만드는 중…';
  try{
    var blob=await makePdf();
    var fn='타임박싱_'+cur+'.pdf';
    if(dl){await dl.save({filename:fn,data:blob})}
    else{var u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=fn;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},4000)}
    b.textContent='저장했어요';
  }catch(e){
    b.textContent=(e&&e.code==='declined')?label:'PDF 저장에 실패했어요';
  }
  setTimeout(function(){b.textContent=label;b.disabled=false},2000);
};
